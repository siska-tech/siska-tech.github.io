<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薙刀式キーボード 設定ツール</title>
  <meta name="description" content="薙刀式 分割キーボードの配列（単打・シフト面・コンボ・編集モード）とパラメータを、PCのブラウザ(WebHID)から再ビルド無しに編集・反映する設定ツール。VIAライクなUI。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">薙</span>
        <span class="title">薙刀式 設定ツール</span>
      </div>
      <div class="devbox">
        <button id="connectBtn" class="primary">端末に接続</button>
        <button id="demoBtn" class="ghost" title="実機なしでUIを試す">デモ</button>
        <span id="devName" class="devname"></span>
        <button id="rereadBtn" class="iconbtn" title="端末から再読込" disabled>⟳</button>
      </div>
      <div class="topstatus"><span id="status" class="status"></span></div>
      <div class="topactions">
        <span id="commitState" class="commit-state"></span>
        <button id="commitBtn" class="primary" disabled>保存 (COMMIT)</button>
        <button id="rebootBtn" disabled>再起動</button>
      </div>
    </header>

    <div class="body">
      <nav class="sidebar" id="sidebar">
        <button class="navbtn active" data-pane="keymap"><span class="navicon">⌨</span>キーマップ</button>
        <button class="navbtn" data-pane="combos"><span class="navicon">⧉</span>コンボ</button>
        <button class="navbtn" data-pane="extra"><span class="navicon">＋</span>直接キー</button>
        <button class="navbtn" data-pane="params"><span class="navicon">⚙</span>パラメータ</button>
        <button class="navbtn" data-pane="file"><span class="navicon">⇅</span>保存 / 読込</button>
      </nav>

      <main class="main">
        <div id="unsupported" class="warn" style="display:none;">
          このブラウザは WebHID 非対応です。Chrome / Edge（デスクトップ版）で開いてください。
        </div>
        <div id="welcome" class="welcome">
          <div class="welcome-card">
            <div class="welcome-logo">薙</div>
            <h1>薙刀式キーボード 設定ツール</h1>
            <p>
              USB接続した薙刀式キーボードの<strong>配列（単打・シフト面・コンボ・編集モード）</strong>と
              <strong>パラメータ</strong>を、再ビルド／UF2書込みなしに編集します。
            </p>
            <p class="hint">
              キーをクリック → 下のパレットから割当。変更は即座に端末RAMへ送られ、
              <strong>保存 (COMMIT)</strong> でフラッシュへ書き込み、<strong>再起動</strong>後に反映されます。
            </p>
            <div class="welcome-actions">
              <button id="connectBtn2" class="primary big">端末に接続</button>
              <button id="demoBtn2" class="ghost">デモデータで試す</button>
            </div>
            <p class="finehint">Chrome / Edge（WebHID対応）専用 ・ VID/PID 0xc0de:0xcafe ・ proto v2</p>
          </div>
        </div>
        <div id="paneRoot" style="display:none;"></div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
